# ============================================================
# Concerto SIEM - NGINX server configuration
# ============================================================
# This file is mounted into the NGINX container at
# /etc/nginx/conf.d/concerto.conf and loaded automatically
# because it matches the *.conf pattern in that directory.
#
# It defines two server blocks:
#   1. HTTP (port 80): redirects all traffic to HTTPS.
#   2. HTTPS (port 443): terminates TLS and proxies to the GUI.
#
# server_name is set to "_", a conventional placeholder that
# never matches a real hostname. This means the block acts as
# the default server for any Host header, which is what we want
# before a domain name is assigned.
# ============================================================

# ------------------------------------------------------------
# HTTP server: redirect everything to HTTPS
# ------------------------------------------------------------
server {
    listen 80;

    # "_" is a placeholder that never matches a real hostname,
    # so this block serves any request that arrives on port 80.
    server_name _;

    # 301 is a permanent redirect. $host preserves the hostname
    # the client used (IP or domain), and $request_uri preserves
    # the full path and query string. This means a request to
    # http://1.2.3.4/statistics/alerts becomes
    # https://1.2.3.4/statistics/alerts.
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------
# HTTPS server: terminate TLS and proxy to the GUI
# ------------------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    # Certificate and private key, mounted read-only from
    # proxy/certs/ on the host. Both files are generated by the
    # certs-init target in Makefile.certs.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # --------------------------------------------------------
    # Proxy all requests to the GUI container
    # --------------------------------------------------------
    location / {
        # Forward requests to the GUI container. The hostname
        # "gui" is resolved by Podman's internal DNS on the
        # proto_proto network. Port 80 is the container's internal
        # port, not the host port 8000.
        proxy_pass http://gui:80;

        # Preserve the original Host header so the application
        # sees the hostname the client used. This is required for
        # Prewikka's CSRF origin check: the Origin header sent by
        # the browser is compared against the host Prewikka
        # believes it is serving.
        proxy_set_header Host              $host;

        # Pass the real client IP to the application, so it can
        # log it and apply any IP-based logic. Without this, all
        # requests would appear to come from the NGINX container.
        proxy_set_header X-Real-IP         $remote_addr;

        # Standard forwarding header: preserves the full chain of
        # proxies the request passed through. Used by applications
        # that need to know the original client address.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Tell the application that the original request was
        # HTTPS, even though NGINX forwards it to the GUI over
        # plain HTTP inside the container network. This is
        # critical for Prewikka's CSRF check: without it,
        # Prewikka sees "http" as its own scheme while the browser
        # sends "https" in the Origin header, and the check fails
        # with "Origin check failed".
        proxy_set_header X-Forwarded-Proto https;

        # Forward the original hostname as seen by the client.
        # Some applications use this instead of Host when
        # reconstructing absolute URLs. Adding it makes the proxy
        # transparent for applications that rely on either header.
        proxy_set_header X-Forwarded-Host  $host;
    }
}
