ruleset:
  name: sonicwall_parsing
  rules:
  - id: 4604
    fields:
      '[@metadata][IDMEFv2][source]': source
      '[@metadata][IDMEFv2][target]': host
      '[Type][0]': Cyber
      '[Category][0]': Availability.DoS
      '[Analyzer][Data]':
      - Log
      '[Analyzer][Method]':
      - Rule-based
      '[Priority]': Medium
      '[Description]': Attaque de disponibilite detectee. Risque de degradation ou
        interruption de service.
      '[Source][0][IP]': '%{[Attachment][RawLog][Content][source][address]}'
      '[Target][0][IP]': '%{[Attachment][RawLog][Content][destination][address]}'
