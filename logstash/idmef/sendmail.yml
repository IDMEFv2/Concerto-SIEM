ruleset:
  name: sendmail_parsing
  rules:
  - id: 3701
    fields:
      '[@metadata][IDMEFv2][source]': source
      '[@metadata][IDMEFv2][target]': host
      '[Type][0]': Cyber
      '[Category][0]': Access.Unauthorized
      '[Analyzer][Data]':
      - Log
      '[Analyzer][Method]':
      - Rule-based
      '[Priority]': Medium
      '[Description]': 'Evenement detecte: Jun 19 23:20:27 mail sendmail[28096]: i5K6KJmk028096:
        ruleset=check_rcpt, arg1=<support@microsoft.com>, relay=[211.243.4. Risque
        d acces non autorise ou de compromission.'
      '[Source][0][IP]': '%{[Attachment][RawLog][Content][source][address]}'
      '[Target][0][User]': '%{[Attachment][RawLog][Content][user][target][name]}'
