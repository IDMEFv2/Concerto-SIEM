apiVersion: v1
kind: ConfigMap
metadata:
  name: correlator-configmap
  labels:
    app: correlator
data:
  config.yaml: |
    rules_folder: /opt/elastalert/rules
    
    run_every:
      seconds: 10
    
    buffer_time:
      minutes: 15
    
    es_host: es01
    es_port: 9200
    es_username: elastic
    es_password: {{ .Values.elasticsearch.secrets.password}}
    
    writeback_index: elastalert_status
    
    alert_time_limit:
      days: 2
  kafka.yaml: |
    Hostname: "CorrelatorHostname"
    IP: "192.168.34.1"
    Location: "Safe4SOC - Prototype"
    Model: "Concerto Correlator 2.1"
    Name: "Concerto Correlator"
    UnLocation: "FR PAR"
    bootstrapserver: "kafka:9092"
