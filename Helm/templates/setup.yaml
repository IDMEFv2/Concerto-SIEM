apiVersion: batch/v1
kind: Job
metadata:
  name: "setup"
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "hook-succeeded"
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: setup
        image: "{{ coalesce .Values.setup.image.repository .Values.global.image.repository }}/{{ .Values.setup.image.name }}:{{ coalesce .Values.setup.image.tag .Values.global.image.tag }}"
        env:
        - name: POSTGRES_PASSWORD
          value: {{ .Values.postgresql.db.password }}
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.db.user }}
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.db.name }}
        volumeMounts:
          - name: setup-entrypoint
            mountPath: /entrypoint.sh
            subPath: entrypoint.sh
      volumes:
        - name: setup-entrypoint
          configMap:
            name: setup-entrypoint
            defaultMode: 0755
