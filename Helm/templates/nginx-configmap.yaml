apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app: nginx
data:
  default.conf: |
    server {
        listen 80;
        server_name {{ .Values.nginx.serverName }};

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name {{ .Values.nginx.serverName }};

        ssl_certificate /etc/letsencrypt/live/{{ .Values.nginx.serverName }}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/{{ .Values.nginx.serverName }}/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://gui;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    
    error_log  /var/log/nginx/error.log notice;
    pid        /run/nginx.pid;
    
    
    events {
        worker_connections  1024;
    }
    
    
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
    
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';
    
        access_log  /var/log/nginx/access.log  main;
    
        sendfile        on;
    
        keepalive_timeout  65;
    
        include /etc/nginx/conf.d/*.conf;
    }

    stream {
        server {
            listen 4690 ssl;

            ssl_certificate /etc/letsencrypt/live/{{ .Values.nginx.serverName }}/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/{{ .Values.nginx.serverName }}/privkey.pem;

            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;
            ssl_prefer_server_ciphers on;

            proxy_pass logstash:4690;

            proxy_timeout 120s;
            proxy_connect_timeout 120s;
        }
    }
