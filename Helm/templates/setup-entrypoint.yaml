apiVersion: v1
kind: ConfigMap
metadata:
  name: setup-entrypoint
  labels:
    app: setup
data:
  entrypoint.sh: |
    #!/usr/bin/env bash
    
    set -u
    set -o pipefail
    
    echo "Running setup"
    
    echo "Waiting for database to be ready ..."
    while true; do
        pg_isready -U postgres -h postgres
        if [ $? -eq 0 ]; then
            break
        else
            sleep 2
        fi
    done
    echo "Database is ready"
    
    USER_EXISTS=$(PGPASSWORD=postgres psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$POSTGRES_USER';")
    
    if [ "$USER_EXISTS" = "1" ]; then
    	echo "User $POSTGRES_USER already exists, skipping creation."
    else
    	echo "Creating user in database ..."
    	PGPASSWORD=postgres psql -h postgres -U postgres -c "CREATE DATABASE $POSTGRES_DB;" || :
    	PGPASSWORD=postgres psql -h postgres -U postgres -c "CREATE USER $POSTGRES_USER WITH ENCRYPTED PASSWORD '$POSTGRES_PASSWORD';" || :
    	PGPASSWORD=postgres psql -h postgres -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE $POSTGRES_DB TO $POSTGRES_USER;" || :
    	PGPASSWORD=postgres psql -h postgres -U postgres -c "ALTER DATABASE $POSTGRES_DB OWNER TO $POSTGRES_USER;" || :
    	echo "User created"
    fi
    
    echo "Waiting for elasticsearch to be ready ..."
    until curl --user elastic:elastic 'http://es01:9200/_cluster/health?wait_for_status=yellow&timeout=30s'; do
        sleep 2
    done
    
    curl -u elastic:elastic \
    -X PUT localhost:9200/_index_template/proto-default \
    -H 'Content-Type: application/json' \
    -d '{
      "index_patterns": [
        "logs*",
        "alerts*",
        "elastalert*"
      ],
      "priority": 1001,
      "template": {
        "settings": {
          "number_of_replicas": 0
        }
      }
    }'
    
    curl --user elastic:elastic \
    -XPUT 'http://localhost:9200/_cluster/settings' \
    -H 'Content-Type: application/json' \
    -d '{
      "persistent": {
        "cluster.routing.allocation.disk.watermark.low": "97%",
        "cluster.routing.allocation.disk.watermark.high": "98%",
        "cluster.routing.allocation.disk.watermark.flood_stage": "99%"
      }
    }'
    
    echo "Elasticsearch is ready"
    
    echo "Logstash: Send first log and first IDMEFv2 ..."
    
    until `curl --user elastic:elastic -fs 'http://es01:9200/_cat/indices?h=index' | grep -q alerts`; do
           printf '<34>1 %s itguxweb2 sshd 24541 - - Failed password for root from 12.34.56.78 port 1806\n' "$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')" | nc -q 5 logstash 6514
    done
    
    echo "Logstash is ready"
    
    echo "Setup ended"
