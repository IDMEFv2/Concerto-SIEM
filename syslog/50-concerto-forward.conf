# ============================================================
# Concerto SIEM - Syslog Forwarding Configuration
# ============================================================
#
# This file is managed by the Concerto SIEM Makefile.
# Do not edit manually if you use `make log-start` / `make log-stop`.
#
# It forwards all syslog messages to the Concerto SIEM Logstash
# listener on 127.0.0.1:6514 over TCP.
#
# The queue settings below prevent a known failure mode:
# if the SIEM is stopped for an extended period while forwarding
# remains active, an unbounded rsyslog queue can consume memory
# and disk, and delay DNS resolution system-wide. The settings
# below cap the queue and limit retries so the host stays stable.
#
# - queue.maxDiskSpace : hard cap on disk queue size (100 MB)
# - queue.saveOnShutdown : keep queued logs across rsyslog restarts
# - action.resumeRetryCount : suspend action after 2 failed attempts
# - action.resumeInterval : retry suspended action every 10 seconds
#
# To disable forwarding: make log-stop
# To disable and discard queued logs: make log-clear
# ============================================================

*.* action(
  type="omfwd"
  target="127.0.0.1"
  port="6514"
  protocol="tcp"
  queue.type="LinkedList"
  queue.filename="concerto_fwd"
  queue.maxDiskSpace="100m"
  queue.saveOnShutdown="on"
  action.resumeRetryCount="2"
  action.resumeInterval="10"
)